<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== ดีไซน์ UI: ให้ห้องเป็นพระเอก · ปุ่มเป็นกระจกฝ้าลอยเบา ๆ · ไอคอนเส้น Phosphor ===== */
:root{
  --bg1:#f4f1ec; --bg2:#e2ddd5;
  --ink:#2f2c29; --ink-2:#6f6860; --ink-3:#9a938a;
  --glass:rgba(252,250,247,.72); --glass-strong:rgba(252,250,247,.9); --glass-line:rgba(47,44,41,.08);
  --card:#fffdfa; --card-sel:#efe8de; --dark:#2f2c29; --dark-ink:#faf7f2; --accent:#a07c5b;
  --sh-1:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px var(--glass-line),0 1px 2px rgba(40,30,20,.08),0 4px 12px rgba(40,30,20,.08);
  --sh-2:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 1px var(--glass-line),0 2px 4px rgba(40,30,20,.08),0 12px 32px rgba(40,30,20,.14);
  --r-pill:999px; --gut:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg1:#2b2927; --bg2:#1b1a19; --ink:#f3efe9; --ink-2:#c3bbb1; --ink-3:#8c857c;
  --glass:rgba(44,41,38,.72); --glass-strong:rgba(44,41,38,.92); --glass-line:rgba(255,255,255,.07);
  --card:#3a3633; --card-sel:#4a4440; --dark:#f3efe9; --dark-ink:#2f2c29;
  --sh-1:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  --sh-2:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.35); } }
:root[data-theme="dark"]{ --bg1:#2b2927; --bg2:#1b1a19; --ink:#f3efe9; --ink-2:#c3bbb1; --ink-3:#8c857c;
  --glass:rgba(44,41,38,.72); --glass-strong:rgba(44,41,38,.92); --glass-line:rgba(255,255,255,.07); --card:#3a3633; --card-sel:#4a4440; --dark:#f3efe9; --dark-ink:#2f2c29; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 40%,var(--bg1),var(--bg2));color:var(--ink);font-family:"Anuphan",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ic{width:20px;height:20px;display:block;flex-shrink:0}
.ic svg{width:100%;height:100%;display:block}

#holder{position:fixed;inset:0;overflow:hidden;cursor:grab}
#holder.panning{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage canvas{position:absolute;left:0;top:0}
#bgc{z-index:0} #shadow{z-index:7;pointer-events:none} .plat{position:absolute;left:0;top:0;pointer-events:none}
.it,.wp{position:absolute;transform-origin:50% 100%}
.it{pointer-events:none}
#holder.overitem{cursor:pointer} body.editing #holder.overitem{cursor:grab}
.it .spr{width:100%;height:100%;background-repeat:no-repeat;background-size:100% 100%;transform-origin:50% 100%}
.it.flip .spr{transform:scaleX(-1)}
.it.dragging{opacity:.9;filter:drop-shadow(0 10px 14px rgba(40,30,20,.25))}
.it.sel .spr{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 6px rgba(160,124,91,.6))}
.it.boing{animation:boing .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:scale(1,1)}30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
.it.wobble{animation:wobble .5s ease-in-out}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.5deg)}65%{transform:rotate(1.2deg)}}
.it.sway{animation:sway 1.2s ease-in-out}
@keyframes sway{0%,100%{transform:skewX(0)}30%{transform:skewX(-3deg)}65%{transform:skewX(2deg)}}
.it.flutter .spr{animation:flutter .5s ease-out}
@keyframes flutter{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.96)}}
.it.lit .spr{filter:brightness(1.06) drop-shadow(0 0 10px rgba(255,220,160,.55))}
.it.tvon .spr,.it.twinkle .spr,.it.flame .spr{filter:brightness(1.08)}
#night{position:absolute;left:0;top:0;background:#1d2350;mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:900;transition:opacity .8s}
body.isnight #night{opacity:.55}
/* แผนที่แสง (กลางคืน): ทาความมืดทั้งฉาก + บวกแสงโคม แล้วคูณทับฉาก */
#lmap{position:absolute;left:0;top:0;pointer-events:none;z-index:900;mix-blend-mode:multiply;opacity:0;transition:opacity .8s}
body.lmap #night{display:none} body.lmap.isnight #lmap{opacity:1}
/* แสงจันทร์จากผนังกระจก: ชั้นใต้เฟอร์นิเจอร์ (ส่องแค่พื้น) ไม่งั้นขอบแสงพาดทับของเป็นเส้น */
#moon{position:absolute;left:0;top:0;pointer-events:none;z-index:8;mix-blend-mode:screen;opacity:0;transition:opacity .8s} body.lmap.isnight #moon{opacity:1}
body.lmap #pools{display:none} body.lmap .glow{transform:scale(.45)}   /* แผนที่แสงทำแสงตกพื้นเอง · วงเรืองเหลือแค่รอบหลอด */
.glow{position:absolute;pointer-events:none;z-index:901;border-radius:50%;mix-blend-mode:screen;opacity:0;transition:opacity .6s;
  background:radial-gradient(closest-side,rgba(255,214,140,.5),rgba(255,190,120,.15) 60%,rgba(255,190,120,0))}
body.isnight .glow{opacity:1}
/* ---- แอนิเมชันทับภาพ (ไม่วาดลงภาพ) ---- */
.fx{position:absolute;pointer-events:none}
.lyr{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%}
.lyr.leaf{animation:leaf 5.5s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes leaf{0%,100%{transform:rotate(-.7deg) skewX(.6deg)}50%{transform:rotate(.7deg) skewX(-.6deg)}}
.vinyl{transform:scaleY(var(--sy));opacity:0;transition:opacity .4s}
.vinyl>i{position:absolute;inset:0;border-radius:50%}
.vinyl .sheen{background:conic-gradient(rgba(255,255,255,0) 0 12%,rgba(255,255,255,.2) 18%,rgba(255,255,255,0) 25% 62%,rgba(255,255,255,.14) 68%,rgba(255,255,255,0) 75%);
  -webkit-mask:radial-gradient(circle,transparent 37%,#000 39% 64%,transparent 67%);mask:radial-gradient(circle,transparent 37%,#000 39% 64%,transparent 67%)}
.vinyl .label{inset:32%;background:conic-gradient(#a37e64 0 8%,#b48d71 8% 50%,#a37e64 50% 58%,#b48d71 58%)}
.vinyl .label::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#efe9e0}
.vinyl.on{opacity:1}
.vinyl.on>i{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hands{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wisp{position:absolute;overflow:visible}
.wisp path{fill:none;stroke:rgba(255,255,255,.9);stroke-linecap:round;opacity:0;animation:wisp 3.6s ease-out infinite}
.wisp path:nth-child(2){animation-delay:1.2s} .wisp path:nth-child(3){animation-delay:2.4s}
@keyframes wisp{0%{opacity:0;transform:translateY(4px) scaleX(.7)}25%{opacity:.75}100%{opacity:0;transform:translateY(-14px) scaleX(1.3)}}
#pools{position:absolute;left:0;top:0;pointer-events:none;z-index:901;mix-blend-mode:screen}   /* ตัดให้อยู่ในพื้นห้องเท่านั้น */
.pool{position:absolute;border-radius:50%;opacity:0;transition:opacity .6s;
  background:radial-gradient(closest-side,rgba(255,210,140,.42),rgba(255,195,125,.16) 55%,rgba(255,190,120,0))}
/* ป้ายทางออก: แคปซูลกระจกฝ้า (วงลูกศรทอง + "ไปที่" + ชื่อห้อง) · วางใต้พรมเช็ดเท้า ตรงกลาง */
.exit{position:absolute;z-index:950;pointer-events:none;display:flex;align-items:center;gap:7px;transform:translate(-50%,0);padding:4px 11px 4px 4px;border-radius:999px;
  background:rgba(34,31,28,.78);-webkit-backdrop-filter:blur(8px) saturate(1.2);backdrop-filter:blur(8px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18);
  color:#f6f1ea;font-family:"Anuphan",sans-serif;white-space:nowrap;animation:exitfloat 3.2s ease-in-out infinite}
.exit .arr{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(160deg,#c9a27a,#9a7350);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.25)}
.exit .arr svg{width:12px;height:12px;fill:#fffaf3;animation:exitnudge 1.6s ease-in-out infinite}
.exit .txt{display:flex;flex-direction:column;line-height:1.15}
.exit .txt small{font-size:7.5px;font-weight:500;letter-spacing:.02em;color:rgba(246,241,234,.62)}
.exit .txt b{font-size:10.5px;font-weight:600}
@keyframes exitfloat{0%,100%{translate:0 0}50%{translate:0 -1.5px}}
@keyframes exitnudge{0%,100%{translate:0 0}50%{translate:1.5px 0}}
@media (prefers-reduced-motion:reduce){ .exit .arr{animation:none} }
.pool.on{opacity:.35} body.isnight .pool.on{opacity:1}
.pt{position:absolute;pointer-events:none;z-index:970}
/* ---- ปลูกผัก ---- */
/* ---- เครื่องซักผ้า (ถังหมุน+สั่น) · ก๊อกน้ำ · เครื่องฟอกอากาศ · ดูดฝุ่น · กระถางแขวนแกว่ง ---- */
.drum{position:absolute;border-radius:50%;overflow:hidden;opacity:0;transition:opacity .4s;pointer-events:none}
.drum.on{opacity:1} .drum i{position:absolute;inset:-25%;border-radius:50%;background:conic-gradient(rgba(190,215,240,.0),rgba(190,215,240,.75) 15%,rgba(255,255,255,0) 32%,rgba(150,185,225,.6) 55%,rgba(255,255,255,0) 72%,rgba(220,235,250,.7) 88%,rgba(190,215,240,0));animation:spin .8s linear infinite}
.it.washing .spr{animation:shake .18s linear infinite} @keyframes shake{0%,100%{translate:0 0}25%{translate:.5px -.3px}75%{translate:-.5px .3px}}
.stream{position:absolute;width:2.6px;border-radius:2px;background:linear-gradient(rgba(200,230,250,.95),rgba(140,200,240,.75));transform-origin:50% 0;pointer-events:none;animation:stream 2.6s ease-in-out forwards}
@keyframes stream{0%{transform:scaleY(0)}12%{transform:scaleY(1)}85%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.air{position:absolute;opacity:0;transition:opacity .5s;pointer-events:none} .air.on{opacity:1}
.air path{fill:none;stroke:rgba(170,215,240,.9);stroke-width:1.4;stroke-linecap:round;opacity:0;animation:wisp 2.4s ease-out infinite}
.air path:nth-child(2){animation-delay:.8s} .air path:nth-child(3){animation-delay:1.6s}
.puff{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(220,212,198,.9);pointer-events:none;animation:puff .8s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),-10px) scale(1.6)}}
.it.swing .spr{transform-origin:50% 0;animation:swing 4.5s ease-in-out infinite} .it.swing.flip .spr{animation-name:swingf}
@keyframes swing{0%,100%{rotate:-1.6deg}50%{rotate:1.6deg}} @keyframes swingf{0%,100%{transform:scaleX(-1) rotate(-1.6deg)}50%{transform:scaleX(-1) rotate(1.6deg)}}
@media (prefers-reduced-motion:reduce){ .drum i,.it.washing .spr,.air path,.it.swing .spr{animation:none} }
.farm{position:absolute;inset:0;pointer-events:none;overflow:visible}
.farm .soil{position:absolute;inset:0;transition:background-color .8s}
.farm .soil.wet{background:rgba(38,22,12,.42)} .farm .soil.dry{background:rgba(236,206,160,.26)}
.farm .pl{position:absolute;background-size:100% 100%;transform-origin:50% 100%;animation:sprout .5s cubic-bezier(.3,1.6,.5,1) both}
.farm .pl.ripe{animation:sprout .5s cubic-bezier(.3,1.6,.5,1) both, ripe 2.4s ease-in-out .5s infinite}
@keyframes sprout{0%{transform:scale(.2,.1)}100%{transform:scale(1)}}
@keyframes ripe{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg) scale(1.02)}}
.fbadge{position:absolute;z-index:960;transform:translate(-50%,-100%);pointer-events:none;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 4px;border-radius:999px;
  background:rgba(34,31,28,.78);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 0 0 1px rgba(255,255,255,.08),0 4px 10px rgba(0,0,0,.18);color:#f6f1ea;font:600 9px/1 "Anuphan",sans-serif;white-space:nowrap}
.fbadge i{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:8px}
.fbadge .bar{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden} .fbadge .bar b{display:block;height:100%;background:#8fbf7a;border-radius:2px}
.fbadge.dry i{background:#5aa6d6} .fbadge.ripe i{background:#e0a23a} .fbadge.grow i{background:#6f9f5c}
.fbadge.ripe{animation:exitfloat 1.6s ease-in-out infinite}
.drop{position:absolute;z-index:975;width:3px;height:6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8fd0f5;pointer-events:none;animation:drop .7s ease-in forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-22px)}20%{opacity:1}100%{opacity:0;transform:translateY(0)}}
.pop{position:absolute;z-index:980;pointer-events:none;background-size:100% 100%;animation:pop 1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}25%{opacity:1;transform:translateY(-18px) scale(1.15)}100%{opacity:0;transform:translateY(-44px) scale(.9)}}
#seedPick{position:fixed;z-index:1070;display:none;gap:4px;padding:6px;border-radius:20px;transform:translate(-50%,-100%)}
#seedPick.show{display:flex}
#cookPick{position:fixed;z-index:1070;display:none;flex-direction:column;gap:6px;padding:10px;border-radius:20px;transform:translate(-50%,-100%);width:min(300px,calc(100vw - 32px))}
#cookPick.show{display:flex} #cookPick h3{margin:2px 6px 4px;font-size:14px;font-weight:600;color:var(--ink)} #cookPick small.pan{margin:0 6px 4px;font-size:12px;color:var(--ink-2)}
#cookPick button{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:14px;text-align:left;color:var(--ink);min-height:52px}
#cookPick button span.im{width:40px;height:40px;flex:none;background-size:contain;background-repeat:no-repeat;background-position:center}
#cookPick button b{display:block;font-size:13px;font-weight:600} #cookPick button i{display:block;font-style:normal;font-size:11px;color:var(--ink-2)}
#cookPick button:disabled{opacity:.4} @media (hover:hover) and (pointer:fine){ #cookPick button:not(:disabled):hover{background:rgba(127,117,105,.14)} } #seedPick button{width:64px;padding:6px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink)}
#seedPick button span.im{width:36px;height:36px;background-size:contain;background-repeat:no-repeat;background-position:center}
@media (hover:hover) and (pointer:fine){ #seedPick button:hover{background:rgba(127,117,105,.14)} }
.heart,.spark,.steam,.bubble,.note,.dust{display:none}

/* ---- ปุ่มลอย (กระจกฝ้า) ---- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--sh-1)}
.hud{position:fixed;z-index:1000;display:flex;gap:4px;padding:4px;border-radius:var(--r-pill);transition:opacity .2s,transform .2s}
.hud .btn{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--ink)}
@media (hover:hover) and (pointer:fine){ .hud .btn:hover{background:rgba(47,44,41,.06)} }
.hud .btn:active{transform:scale(.94)}
.hud .btn[disabled]{opacity:.35;pointer-events:none}
#viewTR{position:fixed;z-index:1000;display:flex;gap:8px;align-items:center;right:calc(var(--gut) + env(safe-area-inset-right));top:calc(var(--gut) + env(safe-area-inset-top))}   /* แต่งห้อง อยู่ที่เดียวกับ "เสร็จ" ของโหมดแต่ง */
body.editing #viewTR{display:none}   /* (กฎ id ด้านบนชนะ .view-only ต้องซ่อนตรง ๆ) */
#hudBL{left:calc(var(--gut) + env(safe-area-inset-left));bottom:calc(var(--gut) + env(safe-area-inset-bottom));flex-direction:column}
#editTL{left:calc(var(--gut) + env(safe-area-inset-left));top:calc(var(--gut) + env(safe-area-inset-top))}
#editTR{right:calc(var(--gut) + env(safe-area-inset-right));top:calc(var(--gut) + env(safe-area-inset-top));align-items:center}
.pill{height:44px;padding:0 16px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;
  background:var(--dark);color:var(--dark-ink);box-shadow:0 2px 4px rgba(40,30,20,.12),0 10px 24px rgba(40,30,20,.22)}
.pill:active{transform:scale(.97)}
#fab:active{transform:scale(.97)}
.edit-only{display:none} body.editing .edit-only{display:flex} body.editing .view-only{display:none}
body.editing #hudBL{bottom:calc(var(--sheet-h,240px) + 24px + env(safe-area-inset-bottom))}
body.editing.sheet-min #hudBL{bottom:calc(64px + env(safe-area-inset-bottom))}

/* ---- กล่องของ (แผ่นเลื่อนจากล่าง) ---- */
#sheet{position:fixed;z-index:1100;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));width:min(760px,calc(100% - 16px));
  transform:translate(-50%,calc(100% + 40px));transition:transform .32s cubic-bezier(.2,.9,.25,1);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(1.2);backdrop-filter:blur(20px) saturate(1.2);
  border-radius:24px;box-shadow:var(--sh-2);padding:4px 12px 12px}
body.editing #sheet{transform:translate(-50%,0)}
body.editing.sheet-min #sheet{transform:translate(-50%,calc(100% - 44px))}
#sheet .drow,#sheet .striprow{transition:opacity .2s} body.sheet-min #sheet .drow,body.sheet-min #sheet .striprow{opacity:0;pointer-events:none}   /* ย่อแล้วเหลือแค่ปุ่มเปิด ไม่มีแท็บโผล่ครึ่ง ๆ */
body.editing.picking #sheet{transform:translate(-50%,calc(100% + 40px));transition-duration:.15s}
/* ปุ่มย่อ/เปิดกล่องของ: ลูกศร + คำบอก (เดิมเป็นขีดเปล่า เจ้าของดูไม่ออกว่าทำอะไร) */
#minBtn{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 auto;height:32px;padding:0 14px 0 12px;   /* ซ้าย 12 = ช่องว่างในตัว svg 2 จุด → ระยะที่ตาเห็นเท่ากันสองข้าง */border-radius:var(--r-pill);
  font-size:12px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
#minBtn .ic{width:14px;height:14px;display:flex;align-items:center;justify-content:center} #minBtn .ic svg{width:14px;height:14px;display:block;transition:transform .25s}   /* กล่องไอคอนเท่า svg ไม่งั้นลูกศรค้างมุมบนซ้าย (เยื้องจากตัวหนังสือ) */
#minBtn .mlab{line-height:14px}
body.sheet-min #minBtn .ic svg{transform:rotate(180deg)}
#minBtn:focus:not(:focus-visible){outline:none}
@media (hover:hover) and (pointer:fine){ #minBtn:hover{background:rgba(127,117,105,.14);color:var(--ink)} }
.drow{display:flex;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px}
.tab{height:44px;min-width:44px;padding:0 16px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink-2);white-space:nowrap;flex-shrink:0}
.tab .ic{width:18px;height:18px}
@media (hover:hover) and (pointer:fine){ .tab:not([aria-selected="true"]):hover{background:rgba(47,44,41,.05)} }
.tab[aria-selected="true"]{background:var(--dark);color:var(--dark-ink)}
#strip{display:grid;grid-auto-flow:column;grid-auto-columns:104px;gap:8px;overflow-x:auto;padding:4px;scrollbar-width:none;min-height:124px;touch-action:pan-x;overscroll-behavior-x:contain}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px;min-height:120px;border-radius:16px;
  background:var(--card);box-shadow:0 0 0 1px var(--glass-line),0 1px 2px rgba(40,30,20,.06);touch-action:pan-x;cursor:grab}
@media (hover:hover) and (pointer:fine){ .slot:hover{box-shadow:0 0 0 1px rgba(160,124,91,.45),0 4px 10px rgba(40,30,20,.08)} }
.slot .pic{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.slot .pic div{background-repeat:no-repeat;background-size:100% 100%}
.slot span{font-size:12px;line-height:1.25;text-align:center;color:var(--ink-2);word-break:keep-all}
.swatch{cursor:pointer;touch-action:pan-x}
.swatch[aria-pressed="true"]{background:var(--card-sel);box-shadow:0 0 0 2px var(--accent)}
.striprow{display:flex;gap:8px;align-items:stretch} .striprow #strip{flex:1;min-width:0}
.zonebar{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:4px 0 4px 4px} .zonebar[hidden]{display:none}
/* ขอบจางเฉพาะฝั่งที่ยังมีของซ่อนอยู่ (ช่วงจาง 28 จุด) */
#strip.fade-l{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px);mask-image:linear-gradient(to right,transparent 0,#000 28px)}
#strip.fade-r{-webkit-mask-image:linear-gradient(to left,transparent 0,#000 28px);mask-image:linear-gradient(to left,transparent 0,#000 28px)}
#strip.fade-l.fade-r{-webkit-mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent 0,#000 28px,#000 calc(100% - 28px),transparent)}
.zchip{height:34px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2);background:var(--card);box-shadow:0 0 0 1px var(--glass-line)}
.zchip[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink);box-shadow:none}
.sizer{display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:default;grid-column:span 2;align-items:center}
.sizer .lab{font-size:13px;color:var(--ink-2)} .sizer .row{display:flex;align-items:center;gap:12px} .sizer b{font-size:16px;min-width:56px;text-align:center}
.sizer .zchip{width:44px;height:44px;padding:0;font-size:20px} .zchip:disabled{opacity:.35}
.sizer.pickb .zchip{width:auto;height:36px;padding:0 12px;font-size:13px} .sizer.pickb .row{gap:6px}
#blkPrev{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1000;display:none}
#blkPrev polygon{stroke-width:2.5;stroke-dasharray:6 5} #blkPrev .ok{fill:rgba(79,174,106,.28);stroke:#4fae6a} #blkPrev .no{fill:rgba(226,86,107,.28);stroke:#e2566b}

/* ---- แถบเครื่องมือบนของ · ที่ทิ้ง · ข้อความ ---- */
#tools{position:fixed;z-index:1060;display:none;gap:2px;padding:4px;transform:translate(-50%,-100%);border-radius:var(--r-pill)}
#tools.show{display:flex}
#tools button{height:44px;padding:0 16px;border-radius:var(--r-pill);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink)}
@media (hover:hover) and (pointer:fine){ #tools button:hover{background:rgba(47,44,41,.06)} }
#trash{position:fixed;z-index:1050;left:50%;top:calc(var(--gut) + env(safe-area-inset-top));transform:translate(-50%,-160%);
  transition:transform .2s;pointer-events:none}
body.removing #trash{transform:translate(-50%,0)}
body.removing.over #trash{background:#b5543f;color:#fff;transform:translate(-50%,0) scale(1.06)}
#house{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(24,21,18,.38)}
#house.show{display:flex}
.hpanel{width:min(560px,100%);max-height:min(640px,calc(100vh - 32px));overflow:auto;padding:20px;border-radius:24px;background:var(--glass-strong);box-shadow:var(--sh-1);color:var(--ink)}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hhead h2{margin:0;font-size:18px;font-weight:600}
.hsub{margin:4px 0 16px;font-size:13px;color:var(--ink-2)}
.hrooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hroom .hgo{position:absolute;inset:0;border-radius:16px} .hroom.off{opacity:.45}
.hroom>b,.hroom>small,.hroom>.swa,.hroom>.ic{pointer-events:none;position:relative}
.hroom{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;min-height:96px;padding:16px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--glass-line);text-align:left;color:var(--ink);cursor:pointer}
.hroom b{font-size:15px;font-weight:600} .hroom small{font-size:12px;color:var(--ink-2)}
.hroom[aria-current="true"]{box-shadow:0 0 0 2px var(--accent)}
.hroom .swa{position:absolute;left:16px;top:16px;width:28px;height:18px;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.hroom .act{position:absolute;right:8px;top:8px;display:flex;gap:2px}
.hroom .act button{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.hroom .act button .ic svg{width:16px;height:16px}
.hroom.add{align-items:center;justify-content:center;background:transparent;box-shadow:inset 0 0 0 1.5px var(--glass-line);border:1.5px dashed rgba(160,124,91,.5)}
.hform{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px} .hwarn{flex:1 0 100%;margin:0 0 4px;font-size:14px;line-height:1.5}
.hform button.danger{background:#b4513f;color:#fff} .hform input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:0;background:var(--card);color:var(--ink);font:inherit;font-size:15px;box-shadow:0 0 0 1px var(--glass-line)}
.hform button{height:44px;padding:0 16px;border-radius:12px;background:var(--dark);color:var(--dark-ink);font-weight:600}
.hform button.hcancel{background:var(--card);color:var(--ink)}   /* (ห้ามใช้ชื่อ ghost: เป็นคลาสภาพของที่ลากอยู่ position:fixed) */
#toast{position:fixed;z-index:1200;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translate(-50%,-6px);max-width:calc(100% - 32px);
  padding:10px 16px;border-radius:var(--r-pill);font-size:14px;line-height:1.4;text-align:center;color:var(--ink);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ghost{position:fixed;pointer-events:none;z-index:2000;transform-origin:0 0;opacity:.92;background-repeat:no-repeat;background-size:100% 100%;filter:drop-shadow(0 12px 16px rgba(40,30,20,.25))}
@media (max-width:700px){ .tab span:not(.ic){display:none} .tab{padding:0 12px} #strip{grid-auto-columns:92px} }
@media (max-height:500px){
  #sheet{padding:4px 10px 10px} .drow{margin-bottom:6px} #strip{grid-auto-columns:84px;min-height:92px}

</div>

  const g=cvs.getContext('2d'); g.setTransform(RES,0,0,RES,0,0); g.clearRect(0,0,SW,SH);
  const night=body.classList.contains('isnight'), P=roomPolys(), bb=GEO.bb;

  // แผ่นพื้นด้านหน้า (ความหนา) วาดก่อนพื้น: ปลายขอบที่ซอกระหว่างบล็อกต้องถูกพื้นข้างหน้าบัง ไม่ยื่นทับ (ขอบพื้นยกอยู่ในชั้นพื้นยกเอง)
  for(const s of P.slab) slabPoly(g,s);
  const fl=[...P.floor].sort((a,b)=>a.z-b.z);
  for(const f of fl){
    for(const sb of P.stepB) if(sb.zl<f.z && !sb.done){ sb.done=1; for(const q of sb.list) poly(g,q.pts,q.col,'rgba(58,55,51,.45)'); }
    floorFill(g,f,RES); }
  for(const sb of P.stepB) delete sb.done;
  g.save(); pathOf(g,P.floor); g.clip();
  windowLight(g,RES,7,night?'rgba(150,170,230,.16)':'rgba(255,250,235,.32)','rgba(255,250,235,0)');
  g.restore();

  g.strokeStyle='rgba(58,55,51,.32)'; g.lineWidth=1.2; g.beginPath();
  for(const [k,bi] of GEO.cells){ const [x,y]=k.split(',').map(Number), z=blockLift(bi);
    const l=floorAt(x-1,y); if(l!=null&&l!==bi&&blockLift(l)===z){ const a=up(scr(x,y),z),b=up(scr(x,y+1),z); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); }
    const t=floorAt(x,y-1); if(t!=null&&t!==bi&&blockLift(t)===z){ const a=up(scr(x,y),z),b=up(scr(x+1,y),z); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); } }
  g.stroke();
  // ---- บันไดขึ้นที่หันมาทางเรา ----

  g.strokeStyle=INK; g.lineWidth=1.5; g.beginPath(); for(const r of GEO.runs){ const a=up(runPt(r,r.a0),r.z),b=up(runPt(r,r.a1),r.z); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); } g.stroke();
  // ---- ผนัง (วาดในพิกัดผนัง แล้วเอียงเข้าแนว) · สูงก่อน แล้วสันผนัง แล้วผนังเตี้ยที่อยู่หน้ากว่า · พื้นยก = ผนังเริ่มที่พื้นบล็อก ยอดผนังเท่ากันทั้งห้อง ----
  const depth=F=>F.r.c*2+F.r.a0+F.r.a1;
  for(const tall of [true,false]){
    for(const F of P.face.filter(F=>F.r.tall===tall).sort((a,b)=>depth(a)-depth(b))){ const r=F.r, st=blockStyle(r.bi).walls[r.side], len=(r.a1-r.a0)*CW, A=runPt(r,r.a0);

      g.fillStyle=r.side==='L'?'rgba(255,255,255,.04)':'rgba(0,0,0,.07)'; g.fillRect(0,0,len,F.top);   // ด้านขวาเงาเข้มกว่าเล็กน้อย
      if(r.z){ g.fillStyle='rgba(0,0,0,.10)'; g.fillRect(0,r.z,len,10); }   // บัวผนังของพื้นยก
      if(editing&&tall){ // ตารางผนัง (โหมดแต่ง): ช่องละ 2×2 เหมือนพื้น · เส้นตรงกับช่องพื้นทั้งห้อง
        g.strokeStyle=night||st.startsWith('paint-charcoal')?'rgba(255,255,255,.14)':'rgba(60,50,40,.14)'; g.lineWidth=1/RES*1.5;
        for(let x=(((-r.a0)%2)+2)%2*CW;x<=len+.1;x+=2*CW){ g.beginPath(); g.moveTo(x,r.z); g.lineTo(x,WALLH); g.stroke(); }
        for(let y=r.z;y<=WALLH;y+=2*WV){ g.beginPath(); g.moveTo(0,y); g.lineTo(len,y); g.stroke(); } }
      g.restore(); poly(g,F.pts,null,INK); }
    for(const c of P.cap) if(c.tall===tall) poly(g,c.pts,c.col||'#f4f2ee',INK);
    for(const e of P.end) if(e.tall===tall) poly(g,e.pts,e.col,INK);

  if(editing&&curCat==='surface'){ g.save(); g.setLineDash([6,5]); g.lineWidth=2.5; g.strokeStyle='rgba(79,174,106,.95)';

/* ===== แสงกลางคืน: แผนที่แสง (ความมืด + บวกแสงโคม แล้วคูณทับฉาก) + แสงตกพื้น · เจ้าของเลือกแบบนี้ 22 ต.ค. 2569
   ทดสอบแบบอื่นได้ด้วย ?light=a (แบบเดิม: ทาน้ำเงิน+วงเรือง) · ?light=b (แผนที่แสง วงกลมอย่างเดียว) · ?bulb=0..1 ความแรงแสงรอบหลอด ===== */
const LIGHT=(new URLSearchParams(location.search).get('light')||'c').toLowerCase();
if(LIGHT!=='a') document.body.classList.add('lmap');
let lightReq=0;
function requestLights(){ if(LIGHT==='a'||lightReq) return; lightReq=requestAnimationFrame(()=>{ lightReq=0; drawLights(); }); }
function drawLights(){
  const c=$('#lmap'); if(!c||!c.width) return; const g=c.getContext('2d');
  // ความมืด: นอกห้อง/สันผนังมืดกว่า (ใกล้แบบเดิม) · ในห้อง (พื้น+ผนังสองด้าน) น้ำเงินครามอ่อนกว่า
  // นอกห้องเป็นพื้นหลังว่าง (คูณแล้วจะโชว์สีชั้นนี้ตรง ๆ) → วาดความมืดเฉพาะตัวห้อง: สันผนัง+แผ่นพื้นข้าง (มืดกว่า) · ในห้อง (อ่อนกว่า)
  const P=GEO.polys; if(!P) return;
  g.globalCompositeOperation='source-over'; g.clearRect(0,0,SW,SH);
  g.fillStyle='rgb(44,48,88)'; for(const q of [...P.cap,...P.end,...P.slab]){ pathOf(g,[q]); g.fill(); }
  const lit=[...P.floor,...P.face,...P.stepF,...P.stepB.flatMap(s=>s.list)];
  g.fillStyle='rgb(66,72,118)'; for(const q of lit){ pathOf(g,[q]); g.fill(); }
  g.save(); pathOf(g,lit); g.clip();   // แสงทุกดวงอยู่แค่ในห้อง ไม่ฟุ้งออกนอกห้อง
  g.globalCompositeOperation='lighter';
  // แสงจันทร์ผ่านผนังกระจก → วาดลงชั้น #moon (ใต้เฟอร์นิเจอร์) เฉพาะพื้นห้องใกล้ผนังกระจก
  { const m=$('#moon').getContext('2d'); m.clearRect(0,0,SW,SH); m.save(); pathOf(m,P.floor); m.clip(); windowLight(m,1,6,'rgba(120,140,200,.55)','rgba(120,140,200,0)'); m.restore(); }
  const warm=(x,y,r,k)=>{ const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(255,214,160,${k})`); gr.addColorStop(.35,`rgba(240,170,110,${k*.6})`); gr.addColorStop(1,'rgba(200,120,70,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,2*r,2*r); };
  for(const it of items){ if(!it.lit || DEFS[it.key][5]!=='lamp') continue; const r=els.get(it.uid); if(!r) continue;
    const gm=geomOf(it), fx=FX[it.key]||{}, flip=r.el.classList.contains('flip'), px=p=>gm.left+(flip?1-p.x:p.x)*gm.w, L=fx.light||{x:.5,y:.3};
    const bx=px(L), by=gm.top+gm.h*L.y, big=DEFS[it.key][2]==='small'?.55:1;
    if(LIGHT==='b'){ warm(bx,by,200*big,1); continue; }
    // แบบ c: แสงรอบหลอด (เล็กกว่า) + แสงตกพื้นเป็นวงรีตามมุมห้อง (สว่างใต้โคม จางออก)
    const BULB=+(new URLSearchParams(location.search).get('bulb')||.55);   // ความแรงแสงรอบหลอด (0.55 = ไม่กลบโต๊ะคอม/เก้าอี้ข้างโคม)
    warm(bx,by,130*big*(.6+.4*BULB/.85),BULB);
    const P=fx.pool||{x:L.x,y:1}, fx0=px(P), fy0=gm.top+gm.h*P.y, R=(P.r||1.2)*CW*5.5*big;
    g.save(); g.translate(fx0,fy0); g.scale(1,ISO); warm(0,0,R,1); g.restore();
  }
  g.restore(); g.globalCompositeOperation='source-over';
}
function placeGlow(it,g){
  const r=els.get(it.uid), mode=DEFS[it.key][5], want=!!it.lit && ['lamp','lights','candle','tv'].includes(mode);
  if(!want){ r.glow&&r.glow.remove(); r.glow=null; r.pool&&r.pool.classList.remove('on'); return; }

/* ---- ตรวจที่วาง ---- */
function fitsFloor(key,gx,gy,flip,ignore=new Set()){
  const d=DEFS[key], {fw,fd}=fp(key,flip);
  if(!onFloor(key,gx,gy,flip)) return false;   // อยู่บนพื้นทั้งชิ้น · ทางออก: ชิดขอบหน้าเท่านั้น
  if(d[2]==='rug') return true;
  for(let x=gx;x<gx+fw;x++) for(let y=gy;y<gy+fd;y++) if(isWall(x,y)) return false;
  for(const [x,y] of doorCells()) if(x>=gx&&x<gx+fw&&y>=gy&&y<gy+fd) return false;   // หน้าประตู
  for(const o of items){ if(ignore.has(o.uid)) continue; const k=DEFS[o.key][2]; if(k==='rug'||k==='wall'||o.on!=null) continue;
    const b=boxOf(o); if(gx<b.x1&&gx+fw>b.x0&&gy<b.y1&&gy+fd>b.y0) return false; }
  return true;
}
function hostAt(lx,ly,ignore){ // ของเล็ก: หาโต๊ะที่นิ้วชี้อยู่ (คิดความสูงผิวโต๊ะ)
  let best=null;
  for(const o of items){ if(ignore.has(o.uid)) continue; const b=boxOf(o);
    const hz=itemLift(o);
    for(const sp of spotsOf(o)){ const p=scr(sp.x,sp.y), d=Math.hypot(p.x-lx,p.y-sp.z-hz-ly);   // จุดวาง (หลุมเตา): ใกล้นิ้วพอ = ดูดเข้าจุด · ชนะผิวปกติ
      if(d<CW*.75){ const key=(b.x0+b.y0)*1000+sp.z+500-d; if(!best||key>best.k) best={host:o,b,gx:Math.round((sp.x-.5)*100)/100,gy:Math.round((sp.y-.5)*100)/100,k:key,spot:1}; } }
    for(const r of surfsOf(o)){ const {gx,gy}=toCell(lx,ly+r.z+hz), cx=Math.round((gx-.5)*2)/2, cy=Math.round((gy-.5)*2)/2;   // ของเล็กวางทีละครึ่งช่อง (ผิวเล็กอย่างหลังตู้เย็นได้หลายจุด ไม่ดีดออก)
      let px=cx, py=cy;
      if(!cellOn(o,r,cx,cy)){ // นิ้วเลยขอบผิวนิดหน่อย (≤0.6 ช่อง): ดูดเข้าจุดว่างที่ใกล้สุดบนผิวนี้ ไม่ดีดตกพื้น
        if(gx<r.x0-.6||gx>r.x1+.6||gy<r.y0-.6||gy>r.y1+.6) continue; let bd=1e9;
        for(let x=Math.floor(r.x0*2)/2;x<r.x1;x+=.5) for(let y=Math.floor(r.y0*2)/2;y<r.y1;y+=.5){ if(!cellOn(o,r,x,y)) continue; const d=Math.hypot(x+.5-gx,y+.5-gy); if(d<bd){ bd=d; px=x; py=y; } }
        if(bd===1e9) continue; }
      // ซ้อนกันหลายชิ้น: เลือกชิ้นที่อยู่หน้าสุด แล้วผิวที่สูงสุด · จุดที่ดูดจากนอกขอบได้คะแนนรองจากที่ชี้ตรง
      const key=(b.x0+b.y0)*1000+r.z-(px===cx&&py===cy?0:.5); if(!best || key>best.k) best={host:o,b,gx:px,gy:py,k:key}; } }
  return best;
}
function freeOnHost(host,gx,gy,ignore){ return !items.some(o=>o.on===host.uid && !ignore.has(o.uid) && Math.hypot(o.gx-gx,o.gy-gy)<.7); }   // ของเล็กกว้าง ~0.7 ช่อง: ห่างกัน ≥0.7 ไม่ทับ

// ขนาดห้อง: วาดใหม่ทั้งฉาก · ของที่เลยห้องดันกลับเข้ามา · ใหญ่เกินห้อง/ไม่มีที่ = เก็บเข้ากล่อง
function applySize(nx,ny){ NX=nx; NY=ny; layoutRoom(); stage.style.width=SW+'px'; stage.style.height=SH+'px'; }
// บล็อกชุดนี้ใช้ได้ไหม: ไม่ซ้อนกัน · ต่อเป็นผืนเดียว (แตะกันยาว ≥ 2 ช่อง ให้เดินผ่านได้) · ทั้งห้องไม่กว้างเกิน SPAN_MAX
function blocksOK(B){
  if(B.slice(1).some(b=>b.w<BLOCK_MIN||b.h<BLOCK_MIN||b.w>ROOM_MAX||b.h>ROOM_MAX)) return false;
  for(let i=0;i<B.length;i++) for(let j=i+1;j<B.length;j++){ const a=B[i], b=B[j]; if(a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h) return false; }
  const ov=(p0,p1,q0,q1)=>Math.min(p1,q1)-Math.max(p0,q0), touch=(a,b)=>

    if((a.y+a.h===b.y||b.y+b.h===a.y) && ov(a.x,a.x+a.w,b.x,b.x+b.w)>0 && !(offOK(a.x-b.x)&&offOK(a.x+a.w-b.x-b.w))) return false;
    // ร่องว่างระหว่างบล็อกที่ไม่ติดกัน ต้องกว้าง ≥ 1 ม. (ร่อง 50 ซม. = แถบดำ/ขอบพื้นยกลอย)
    const gx=Math.max(b.x-(a.x+a.w),a.x-(b.x+b.w)), gy=Math.max(b.y-(a.y+a.h),a.y-(b.y+b.h));

// ของที่อยู่บนบล็อก b ทั้งชิ้น (พร้อมของเล็กบนนั้น) + ของติดผนังของบล็อกนี้ → ไว้ขยับตามบล็อก

    if(d[2]==='wall'){ if(inB(...wallCell(it))) out.push(it); continue; }
    if(it.on!=null) continue; const x=boxOf(it); if(x.x0>=b.x&&x.x1<=b.x+b.w&&x.y0>=b.y&&x.y1<=b.y+b.h) out.push(it,...carried(it)); }

function shiftStuff(list,dx,dy){ for(const it of list){ if(DEFS[it.key][2]==='wall'){ if(it.wall==='L'){ it.wa=(it.wa||0)+dx; it.u+=dy; } else { it.wa=(it.wa||0)+dy; it.u+=dx; } } else { it.gx+=dx; it.gy+=dy; } } }
// ห้องเปลี่ยนรูป: ของที่ไม่มีพื้น/ไม่มีผนังให้แขวนแล้ว = เก็บเข้ากล่อง

function relayoutAll(gone=0){ const ox=O.x, oy=O.y, wasFit=Math.abs(S-Kfit)<1e-4; applySize(NX,NY); drawScene(); gone+=fixItems(); ensureDoor();

function setRoomSize(nx,ny){
  nx=Math.max(ROOM_MIN,Math.min(ROOM_MAX,nx)); ny=Math.max(ROOM_MIN,Math.min(ROOM_MAX,ny)); if(nx===NX&&ny===NY) return;

  const kept=new Set(items.filter(o=>DEFS[o.key][2]!=='floor'||o.on!=null).map(o=>o.uid));
  for(const it of [...items]){ if(kept.has(it.uid)) continue; const ign=new Set(items.filter(o=>!kept.has(o.uid)).map(o=>o.uid));
    if(fitsFloor(it.key,it.gx,it.gy,it.flip,ign)) kept.add(it.uid); else { removeItem(it); gone++; } }
  relayoutAll(gone);
}
// เซฟเก่าที่บล็อกผิดกติกาปัจจุบัน (เช่นเหลื่อมกัน 50 ซม.): ขยับ/ยืดทีละ 2 ช่องไปที่ถูกที่ใกล้สุด · ไม่ได้จริง ๆ ค่อยตัดบล็อกนั้นออก
function normalizeBlocks(){ const ext=(state.blocks||[]).map(b=>({...b})), main={x:0,y:0,w:NX,h:NY}; if(blocksOK([main,...ext])) return false;
  // ช่องว่างในกรอบห้อง (ยิ่งน้อยยิ่งไม่มีร่อง/ซอก) · ลองทุกทางแล้วเอาที่ช่องว่างน้อยสุด เปลี่ยนน้อยสุด
  const holes=B=>{ const x0=Math.min(...B.map(b=>b.x)), x1=Math.max(...B.map(b=>b.x+b.w)), y0=Math.min(...B.map(b=>b.y)), y1=Math.max(...B.map(b=>b.y+b.h)); return (x1-x0)*(y1-y0)-B.reduce((t,b)=>t+b.w*b.h,0); };

  for(let i=0;i<ext.length;i++){ const head=()=>[main,...ext.slice(0,i+1)]; if(blocksOK(head())) continue; const b0={...ext[i]}; let best=null;

// ต่อบล็อก (เช่นห้องน้ำ) · ย้าย · ปรับขนาด · ลบ — บล็อกที่ i ของ blocks() (0 = ห้องหลัก แก้ผ่าน setRoomSize)
function setBlocks(next,msg){ if(!blocksOK([{x:0,y:0,w:NX,h:NY},...next])){ toast(msg||'ต่อตรงนั้นไม่ได้ ต้องติดกับห้องและไม่ทับบล็อกอื่น',2000); return false; }

function addBlock(){ const B=blocks(), w=10, h=8, C=[];

// ประตูที่ตำแหน่งนี้ใช้ได้ไหม: อยู่บนผนังสูง · ไม่ทับของติดผนัง · ช่องพื้นหน้าประตูไม่มีเฟอร์นิเจอร์

  for(const l of state.links||[]) if(ROOMS[l]&&l!==room&&!items.some(o=>DEFS[o.key][5]==='door'&&doorTo(o)===l&&(o.to===l||!o.to))) addDoorTo(l); }
// วางพรมเช็ดเท้า (ทางออก) บนขอบหน้าที่ว่าง ไม่ทับเฟอร์นิเจอร์และพรมเช็ดเท้าบานอื่น · to = ห้องปลายทาง
function addDoorTo(to){
  const {fw,fd}=fp('doormat',false), free=(gx,gy)=>!items.some(o=>{ const k=DEFS[o.key]; if(o.on!=null||!(k[2]==='floor'||k[5]==='door'&&k[2]==='rug')) return false; const b=boxOf(o); return gx<b.x1&&gx+fw>b.x0&&gy<b.y1&&gy+fd>b.y0; });
  // ขอบหน้าทุกช่วง (ยาวก่อน) จากกลางช่วงออกไป · ขอบล่างซ้ายก่อนขอบล่างขวา
  const C=[]; for(const r of [...GEO.fronts].sort((p,q)=>(p.side===q.side?0:p.side==='R'?-1:1)||(q.a1-q.a0)-(p.a1-p.a0))){
    const len=r.side==='R'?fw:fd, mid=Math.round((r.a0+r.a1-len)/2);
    for(let k=0;k<=r.a1-r.a0;k++) for(const a of [mid+k,mid-k]) if(a>=r.a0&&a+len<=r.a1) C.push(r.side==='R'?[a,r.c-fd]:[r.c-fw,a]); }
  const ok=C.filter(([x,y])=>onFloor('doormat',x,y,false)); if(!ok.length) return null;
  const [gx,gy]=ok.find(([x,y])=>free(x,y))||ok[0]; const it=addItem({key:'doormat',gx,gy,flip:false}); if(to) it.to=to; return it; }
// ป้ายทางออก: ลูกศรชี้ออกนอกห้อง + ชื่อห้องปลายทาง (วาดในเกม ไม่ได้อยู่ในภาพ)
function placeExit(it,r){ if(DEFS[it.key][2]!=='rug'||DEFS[it.key][5]!=='door') return;
  if(!r.exit){ r.exit=document.createElement('div'); r.exit.className='exit'; stage.appendChild(r.exit); }
  const b=boxOf(it), left=frontSide(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)!=='R', P=left?scr((b.x0+b.x1)/2,b.y1):scr(b.x1,(b.y0+b.y1)/2);   // ขอบล่างซ้าย · ขอบล่างขวา
  const ang=left?Math.atan2(CH,-CW):Math.atan2(CH,CW); P.y-=itemLift(it);
  r.exit.innerHTML=`<span class="arr"><svg viewBox="0 0 256 256" aria-hidden="true" style="transform:rotate(${ang}rad)"><path d="M221.66 133.66l-72 72a8 8 0 0 1-11.32-11.32L196.69 136H40a8 8 0 0 1 0-16h156.69l-58.35-58.34a8 8 0 0 1 11.32-11.32l72 72a8 8 0 0 1 0 11.32Z"/></svg></span><span class="txt"><small>ไปที่</small><b></b></span>`; r.exit.querySelector('b').textContent=ROOMS[doorTo(it)].name;
  Object.assign(r.exit.style,{left:P.x+'px',top:(P.y+SLAB+6)+'px'}); }   // ใต้ขอบพื้นหนา ไม่ทับพื้น
function requestDoorFx(){}   // (เคยวาดธรณี+เงาใต้ประตู · เจ้าของไม่ชอบ เอาออกแล้ว)
// ประตู: ช่องพื้นหน้าประตู 1 แถวห้ามวางของ (เดินผ่านได้)
function doorCells(){ const out=[]; for(const o of items){ if(DEFS[o.key][5]!=='door') continue; const hw=DEFS[o.key][3]/(2*CW);
  for(let k=Math.floor(o.u-hw);k<Math.ceil(o.u+hw);k++) out.push(o.wall==='L'?[o.wa||0,k]:[k,o.wa||0]); } return out; }

/* ===== แผนผังบ้าน: ทุกห้องเป็นการ์ด · แตะ = ไป · สร้าง/เปลี่ยนชื่อ/ลบห้องที่สร้างเอง
   เปิดจากปุ่ม "ไปห้อง…" ของประตู (โหมดแต่ง) = เลือกปลายทางของประตูบานนั้น ===== */
let housePick=null;
const FLOORCOL={terracotta:'#c9825e', 'garden-soil':'#7a5a40', oak:'#d9b88f', walnut:'#8a6448', 'grey-wood':'#b9b1a6', concrete:'#cfccc7', tile:'#e8dfd2'};
function floorSwatch(id){ if(id===room) return FLOORCOL[state.floor]||'#ccc'; let f=ROOMS[id].floor; try{ const s=JSON.parse(localStorage.getItem(ROOMS[id].key)||'null'); if(s&&s.floor) f=s.floor; }catch(e){} return FLOORCOL[f]||'#ccc'; }
function openHouse(door=null){ housePick=door; hideTools(); renderHouse(); $('#house').classList.add('show'); setTimeout(()=>$('#houseRooms .hgo:not([disabled])')?.focus(),30); }
function closeHouse(){ $('#house').classList.remove('show'); housePick=null; }
function renderHouse(form){ const box=$('#houseRooms'); box.innerHTML='';
  $('#houseTitle').textContent=housePick?'ประตูนี้ไปห้องไหน':'บ้านของฉัน';
  $('#houseSub').textContent=housePick?'เลือกห้องปลายทาง ห้องนั้นจะมีประตูกลับมาให้เอง':'แตะห้องเพื่อไป · สร้างห้องใหม่ได้';
  for(const [id,R] of Object.entries(ROOMS)){
    const here=id===room, chosen=!!housePick&&doorTo(housePick)===id, c=document.createElement('div'); c.className='hroom'+(housePick&&here?' off':'');
    c.setAttribute('aria-current',(housePick?chosen:here)?'true':'false');
    c.innerHTML=`<button class="hgo"></button><span class="swa" style="background:${floorSwatch(id)}"></span><b></b><small>${here?'อยู่ที่นี่':chosen?'ปลายทางตอนนี้':R.custom?'ห้องที่สร้างเอง':''}</small>`;
    c.querySelector('b').textContent=R.name; const go=c.querySelector('.hgo'); go.setAttribute('aria-label',(housePick?'ให้ประตูไป':'ไป')+R.name); if(housePick&&here) go.disabled=true;
    go.addEventListener('click',()=>pickRoom(id));
    if(R.custom&&!housePick){ const act=document.createElement('span'); act.className='act';
      act.innerHTML=`<button aria-label="เปลี่ยนชื่อ${R.name}"><span class="ic">${svgIcon('pencil-simple')}</span></button><button aria-label="ลบ${R.name}"><span class="ic">${svgIcon('x')}</span></button>`;
      const [rn,dl]=act.querySelectorAll('button'); rn.addEventListener('click',()=>renderHouse({mode:'rename',id})); dl.addEventListener('click',()=>renderHouse({mode:'delete',id})); c.appendChild(act); }
    box.appendChild(c); }
  const add=document.createElement('div'); add.className='hroom add'; add.innerHTML=`<button class="hgo" aria-label="สร้างห้องใหม่"></button><span class="ic">${svgIcon('plus')}</span><b>ห้องใหม่</b>`;
  add.querySelector('.hgo').addEventListener('click',()=>renderHouse({mode:'new'})); box.appendChild(add);
  if(!form) return;
  const f=document.createElement('form'); f.className='hform'; box.appendChild(f);
  if(form.mode==='delete'){ const R=ROOMS[form.id];
    f.innerHTML=`<p class="hwarn"></p><button type="button" class="hcancel">ยกเลิก</button><button type="submit" class="danger">ลบห้อง</button>`;
    f.querySelector('p').textContent=`ลบ "${R.name}"? ของทุกชิ้นในห้องนี้จะหายด้วย`; }
  else { f.innerHTML=`<input maxlength="20" placeholder="ชื่อห้อง เช่น ห้องซักผ้า" aria-label="ชื่อห้อง"><button type="submit">${form.mode==='new'?'สร้าง':'บันทึก'}</button><button type="button" class="hcancel">ยกเลิก</button>`;
    if(form.mode==='rename') f.querySelector('input').value=ROOMS[form.id].name; }
  f.querySelector('.hcancel').addEventListener('click',()=>renderHouse());
  f.addEventListener('submit',e=>{ e.preventDefault(); const name=(f.querySelector('input').value||'').trim();
    if(form.mode==='delete') return deleteRoom(form.id);
    if(!name){ f.querySelector('input').focus(); return; }
    form.mode==='new'?createRoom(name):renameRoom(form.id,name); });
  setTimeout(()=>(form.mode==='delete'?f.querySelector('button'):f.querySelector('input')).focus(),20); }
function pickRoom(id){
  if(housePick){ if(id===room) return; const d=housePick; pushUndo(); d.to=id; linkBack(id,room); place(d); commit(); closeHouse(); toast('ประตูนี้พาไป'+ROOMS[id].name+'แล้ว',1600); return; }
  closeHouse(); if(id!==room) goRoom(id); }
function createRoom(name){ const id='r'+Date.now().toString(36); ROOMS[id]=customRoom({id,name}); saveCustomRooms(); linkBack(id,room);
  if(housePick){ const d=housePick; pushUndo(); d.to=id; place(d); commit(); closeHouse(); toast('สร้าง'+name+'แล้ว · ประตูนี้พาไปที่นั่น',1800); return; }
  addDoorTo(id); for(const it of items) place(it); commit(); closeHouse(); goRoom(id); toast('สร้าง'+name+'แล้ว · มีประตูกลับห้องเดิมให้แล้ว',2200); }
function renameRoom(id,name){ ROOMS[id].name=name; saveCustomRooms(); for(const it of items) place(it); renderHouse(); }
function deleteRoom(id){ const name=ROOMS[id].name; if(room===id) goRoom('bedroom');
  try{ localStorage.removeItem(ROOMS[id].key); }catch(e){} delete ROOMS[id]; saveCustomRooms();
  for(const it of [...items]) if(it.to===id){ if(DEFS[it.key][2]==='rug') removeItem(it); else delete it.to; }   // พรมเช็ดเท้าที่พาไปห้องนั้นเก็บไป · ประตูบนผนังกลับเป็นค่าเริ่ม
  state.links=(state.links||[]).filter(l=>l!==id); ensureDoor(); for(const it of items) place(it); commit(); renderHouse(); toast('ลบ'+name+'แล้ว',1600); }
$('#mapBtn').addEventListener('click',()=>openHouse());
$('#goBtn').addEventListener('click',()=>{ if(selected&&DEFS[selected.key][5]==='door') openHouse(selected); });
$('#houseClose').addEventListener('click',closeHouse);
$('#house').addEventListener('click',e=>{ if(e.target.id==='house') closeHouse(); });

/* ===== ปลูกผัก: แปลงเปล่า → หว่าน → ต้นอ่อน → โตครึ่ง → สุก → เก็บ → แปลงเปล่า
   it.farm = {crop, g (ms ที่โตไปแล้ว ขณะดินชื้น), wet (เวลาที่ดินจะแห้ง), t (เวลาที่คิดล่าสุด)} · โตเฉพาะตอนดินชื้น · ปิดเกมก็ยังโต (คิดย้อนตอนเปิด)
   ภาพ: farm-bed (แปลง) · <ผัก>-1..3 (ระยะ) · crop-<ผัก> (ผลที่เก็บ) · ภาพยังไม่มี = ผักชนิดนั้นยังไม่ขึ้นให้เลือก ===== */
const CROPS={tomato:'มะเขือเทศ', lettuce:'ผักกาด', carrot:'แครอท', strawberry:'สตรอเบอร์รี่'};
const GROW=[0,60e3,150e3,240e3], DRY_MS=120e3;   // โต 4 นาที (ดินชื้น) · ดินแห้งใน 2 นาทีหลังรดน้ำ
const cropImg={}; for(const c of Object.keys(CROPS)) for(const k of ['1','2','3','crop']){ const n=k==='crop'?'crop-'+c:c+'-'+k, im=new Image(); im.onload=()=>{ cropImg[n]=im; for(const it of items) if(it.farm) drawFarm(it); }; im.src=IMG+n+'.png'; }
const cropReady=c=>['1','2','3'].every(k=>cropImg[c+'-'+k]);
function farmTick(it,now=Date.now()){ const f=it.farm; if(!f||!f.crop) return; const until=Math.min(now,f.wet||0); if(until>f.t) f.g+=until-f.t; f.t=now; }
function farmStage(f){ if(!f||!f.crop) return 0; return f.g>=GROW[3]?3:f.g>=GROW[1]?2:1; }
const farmWet=f=>f&&f.wet>Date.now();
function soilCells(it){ const d=DEFS[it.key], [x0,y0,x1,y1,z]=(d[6]||{}).soil||[0,0,1,1,0], {fw,fd}=fp(it.key,it.flip);
  const S=it.flip?{x0:it.gx+y0,y0:it.gy+x0,x1:it.gx+y1,y1:it.gy+x1}:{x0:it.gx+x0,y0:it.gy+y0,x1:it.gx+x1,y1:it.gy+y1}; return {...S,z}; }
function drawFarm(it){ const r=els.get(it.uid); if(!r) return; const g=geomOf(it), S=soilCells(it), lift=itemLift(it), f=it.farm||{};
  if(!r.farm){ r.farm=document.createElement('div'); r.farm.className='farm'; r.el.appendChild(r.farm); }
  const L=(x,y)=>{ const p=scr(x,y); return [p.x-g.left, p.y-S.z-lift-g.top]; };
  // ดินแห้ง/ชื้น: ทาสีทับเฉพาะผิวดิน
  const Q=[L(S.x0,S.y0),L(S.x1,S.y0),L(S.x1,S.y1),L(S.x0,S.y1)].map(([x,y])=>x.toFixed(1)+'px '+y.toFixed(1)+'px').join(',');
  let soil=r.farm.querySelector('.soil'); if(!soil){ soil=document.createElement('div'); soil.className='soil'; r.farm.appendChild(soil); }
  soil.style.clipPath=`polygon(${Q})`; soil.className='soil '+(farmWet(f)?'wet':'dry');
  // ต้นผัก: เรียงเป็นแถวตามแนวยาวของแปลง หลังไปหน้า
  const st=farmStage(f), key=f.crop?f.crop+'-'+st:null, im=key&&cropImg[key], want=im?key:'';
  if(r.farm.dataset.k!==want){ r.farm.querySelectorAll('.pl').forEach(e=>e.remove()); r.farm.dataset.k=want;
    if(im){ const long=(S.x1-S.x0)>=(S.y1-S.y0), n=Math.max(2,Math.round((long?S.x1-S.x0:S.y1-S.y0)/1.15)), rows=Math.max(1,Math.round((long?S.y1-S.y0:S.x1-S.x0)/1.1)), w=CW*(st===1?.55:st===2?.85:1.05), h=w*im.naturalHeight/im.naturalWidth;
      const pts=[]; for(let j=0;j<rows;j++) for(let i=0;i<n;i++){ const a=(i+.5)/n, b=(j+.5)/rows; pts.push(long?[S.x0+a*(S.x1-S.x0),S.y0+b*(S.y1-S.y0)]:[S.x0+b*(S.x1-S.x0),S.y0+a*(S.y1-S.y0)]); }
      pts.sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])).forEach(([x,y],k)=>{ const [px,py]=L(x,y), e=document.createElement('div'); e.className='pl'+(st===3?' ripe':'');
        Object.assign(e.style,{left:(px-w/2)+'px',top:(py-h+2)+'px',width:w+'px',height:h+'px',backgroundImage:`url(${im.src})`,animationDelay:(k*.04)+'s'}); r.farm.appendChild(e); }); } }
  farmBadge(it,g,S,lift); }
function farmBadge(it,g,S,lift){ const r=els.get(it.uid), f=it.farm||{}; if(!r.badge){ r.badge=document.createElement('div'); r.badge.className='fbadge'; stage.appendChild(r.badge); }
  const st=farmStage(f), c=scr((S.x0+S.x1)/2,(S.y0+S.y1)/2), top=Math.min(g.top, c.y-S.z-lift-CW*1.6);
  let cls, html;
  if(!f.crop){ cls='grow'; html='<i>+</i>แตะเพื่อปลูก'; }
  else if(st===3){ cls='ripe'; html='<i>✓</i>เก็บได้แล้ว'; }
  else if(!farmWet(f)){ cls='dry'; html='<i>💧</i>ดินแห้ง แตะรดน้ำ'; }
  else { cls='grow'; html=`<i>↑</i>${CROPS[f.crop]}<span class="bar"><b style="width:${Math.min(100,f.g/GROW[3]*100).toFixed(0)}%"></b></span>`; }
  r.badge.className='fbadge '+cls; r.badge.innerHTML=html; r.badge.style.display=editing?'none':'';
  Object.assign(r.badge.style,{left:c.x+'px',top:top+'px'}); }
function farmTap(it){ hideSeed(); const f=it.farm||(it.farm={}); farmTick(it);
  if(f.crop&&farmStage(f)===3) return harvest(it);
  if(!f.crop) return openSeed(it);
  if(!farmWet(f)) return water(it);
  anim(els.get(it.uid).el,'boing'); toast(CROPS[f.crop]+'กำลังโต · อีก '+Math.ceil((GROW[3]-f.g)/60e3)+' นาที',1400); }
function water(it){ const f=it.farm||(it.farm={}); farmTick(it); f.wet=Date.now()+DRY_MS; f.t=Date.now();
  const S=soilCells(it), lift=itemLift(it); for(let i=0;i<14;i++) setTimeout(()=>{ const x=S.x0+Math.random()*(S.x1-S.x0), y=S.y0+Math.random()*(S.y1-S.y0), p=scr(x,y), d=document.createElement('div'); d.className='drop';
    Object.assign(d.style,{left:p.x+'px',top:(p.y-S.z-lift-6)+'px'}); stage.appendChild(d); d.addEventListener('animationend',()=>d.remove()); },i*40);
  drawFarm(it); commit(); toast('รดน้ำแล้ว ดินชุ่ม',1200); }
function harvest(it){ const f=it.farm, c=f.crop, S=soilCells(it), lift=itemLift(it), im=cropImg['crop-'+c]||cropImg[c+'-3'];
  for(let i=0;i<5;i++) setTimeout(()=>{ const p=scr(S.x0+(i+.5)/5*(S.x1-S.x0),(S.y0+S.y1)/2), e=document.createElement('div'); e.className='pop'; const w=CW*.7;
    Object.assign(e.style,{left:(p.x-w/2)+'px',top:(p.y-S.z-lift-w)+'px',width:w+'px',height:w*(im?im.naturalHeight/im.naturalWidth:1)+'px',backgroundImage:im?`url(${im.src})`:''}); stage.appendChild(e); e.addEventListener('animationend',()=>e.remove()); },i*90);
  const hv=pantry(); hv[c]=(hv[c]||0)+5; savePantry(hv);
  it.farm={wet:f.wet,t:Date.now(),g:0}; drawFarm(it); commit(); toast(`เก็บ${CROPS[c]} 5 ชิ้น · ในตะกร้ามี ${hv[c]} ชิ้น`,1800); }
function openSeed(it){ const box=$('#seedPick'); box.innerHTML='';
  const list=Object.keys(CROPS).filter(cropReady); if(!list.length){ toast('ยังไม่มีเมล็ดผัก (ภาพผักยังไม่มา)',1600); return; }
  for(const c of list){ const b=document.createElement('button'); b.innerHTML=`<span class="im" style="background-image:url(${(cropImg['crop-'+c]||cropImg[c+'-3']).src})"></span><span>${CROPS[c]}</span>`;
    b.setAttribute('aria-label','ปลูก'+CROPS[c]); b.addEventListener('click',()=>{ hideSeed(); const f=it.farm||{}; it.farm={crop:c,g:0,t:Date.now(),wet:f.wet||0}; anim(els.get(it.uid).el,'boing'); drawFarm(it); commit();
      toast(farmWet(it.farm)?'ปลูก'+CROPS[c]+'แล้ว':'ปลูก'+CROPS[c]+'แล้ว · ดินแห้ง แตะรดน้ำก่อนนะ',1600); }); box.appendChild(b); }
  const b=els.get(it.uid).el.getBoundingClientRect(); box.style.left=Math.max(150,Math.min(innerWidth-150,b.left+b.width/2))+'px'; box.style.top=Math.max(110,b.top)+'px'; box.classList.add('show'); setTimeout(()=>box.querySelector('button')?.focus(),20); }
function hideSeed(){ $('#seedPick').classList.remove('show'); }
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#seedPick')) hideSeed(); },true);
setInterval(()=>{ if(document.hidden) return; for(const it of items) if(it.farm){ const s0=farmStage(it.farm), w0=farmWet(it.farm); farmTick(it); if(farmStage(it.farm)!==s0||farmWet(it.farm)!==w0||it.farm.crop) drawFarm(it); if(farmStage(it.farm)!==s0) commit(); } },1000);

/* ===== ทำอาหาร (แบบ Animal Crossing: ต้องมีเตา · ใช้ผักที่ปลูกเอง) =====
   ตะกร้าผัก (pantry) ใช้ร่วมทุกห้อง: localStorage 'cozy-pantry' {ผัก: จำนวน}
   แตะเตา → เมนู (ผักไม่พอ = จาง) → ใช้ผัก → ทำ 10 วิ (ป้าย+ไอน้ำ) → ได้อาหาร 1 จานวางบนเตา/โต๊ะว่างที่ใกล้สุด */
const RECIPES=[
  {key:'dish-salad', name:'สลัด', need:{lettuce:2,tomato:1}},
  {key:'dish-carrot-soup', name:'ซุปแครอท', need:{carrot:3}},
  {key:'dish-tomato-pasta', name:'สปาเกตตีซอสมะเขือเทศ', need:{tomato:3}},
  {key:'dish-strawberry-cake', name:'เค้กสตรอเบอร์รี่', need:{strawberry:3}}];
const COOK_MS=10e3;
function pantry(){ try{ const p=JSON.parse(localStorage.getItem('cozy-pantry')||'null'); if(p) return p; }catch(e){}
  const old=(state&&state.harvest)||{}; return {...old}; }   // เซฟเก่าเก็บผักไว้ในห้อง → ย้ายมาตะกร้ากลาง
function savePantry(p){ try{ localStorage.setItem('cozy-pantry',JSON.stringify(p)); }catch(e){} if(state) delete state.harvest; }
const needText=n=>Object.entries(n).map(([c,k])=>CROPS[c]+' '+k).join(' + ');
const canCook=(r,p)=>Object.entries(r.need).every(([c,k])=>(p[c]||0)>=k);
function cookTap(it){ hideCook(); const c=it.cook; if(c&&Date.now()<c.done){ anim(els.get(it.uid).el,'boing'); toast('กำลังทำ'+recipeOf(c.key).name+' อีก '+Math.ceil((c.done-Date.now())/1000)+' วิ',1200); return; }
  const box=$('#cookPick'), p=pantry(); box.innerHTML=`<h3>ทำอาหาร</h3><small class="pan">ในตะกร้า: ${Object.keys(CROPS).map(c=>CROPS[c]+' '+(p[c]||0)).join(' · ')}</small>`;
  for(const r of RECIPES){ if(!DEFS[r.key]) continue; const b=document.createElement('button'), ok=canCook(r,p);
    b.innerHTML=`<span class="im" style="background-image:url(${srcOf(r.key)})"></span><span><b></b><i></i></span>`; b.querySelector('b').textContent=r.name; b.querySelector('i').textContent=needText(r.need)+(ok?'':' (ผักไม่พอ)');
    b.disabled=!ok; b.setAttribute('aria-label','ทำ'+r.name); b.addEventListener('click',()=>startCook(it,r)); box.appendChild(b); }

  setTimeout(()=>box.querySelector('button:not(:disabled)')?.focus(),20); }

document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#cookPick')) hideCook(); },true);
const recipeOf=k=>RECIPES.find(r=>r.key===k);
function startCook(it,r){ hideCook(); const p=pantry(); if(!canCook(r,p)) return; for(const [c,k] of Object.entries(r.need)) p[c]-=k; savePantry(p);
  it.cook={key:r.key,done:Date.now()+COOK_MS}; commit(); anim(els.get(it.uid).el,'boing'); drawCook(it); toast('เริ่มทำ'+r.name,1200); }
function drawCook(it){ const r=els.get(it.uid); if(!r) return; const c=it.cook, g=geomOf(it);
  if(!c){ r.cookB&&r.cookB.remove(); r.cookB=null; r.cookS&&r.cookS.remove(); r.cookS=null; return; }
  if(!r.cookB){ r.cookB=document.createElement('div'); r.cookB.className='fbadge grow'; stage.appendChild(r.cookB);
    r.spr.insertAdjacentHTML('beforeend','<svg class="air on cooksteam" viewBox="0 0 20 30" aria-hidden="true"><path d="M10 28C6 22 14 17 10 11S9 4 11 0"/><path d="M5 28C2 23 8 18 5 12S4 5 6 1"/><path d="M15 28C12 22 18 18 15 12S14 5 16 1"/></svg>'); r.cookS=r.spr.lastElementChild;
    Object.assign(r.cookS.style,{left:(g.w*.35)+'px',top:(-g.w*.25)+'px',width:(g.w*.3)+'px',height:(g.w*.45)+'px'}); }
  const left=Math.max(0,c.done-Date.now()), pct=100-left/COOK_MS*100;
  r.cookB.innerHTML=`<i>♨</i>${recipeOf(c.key).name}<span class="bar"><b style="width:${pct.toFixed(0)}%"></b></span>`; r.cookB.style.display=editing?'none':'';
  Object.assign(r.cookB.style,{left:(g.left+g.w/2)+'px',top:(g.top-6)+'px'});
  if(!left) finishCook(it); }
function finishCook(it){ const key=it.cook.key, name=recipeOf(key).name; it.cook=null; drawCook(it);
  // วางจานบนผิวว่าง: เตาก่อน แล้วโต๊ะที่ใกล้สุด
  const hosts=[it,...items.filter(o=>o!==it&&surfsOf(o).length).sort((a,b)=>Math.hypot(a.gx-it.gx,a.gy-it.gy)-Math.hypot(b.gx-it.gx,b.gy-it.gy))];
  for(const h of hosts) for(const s of surfsOf(h)) for(let x=Math.floor(s.x0*2)/2;x<s.x1;x+=.5) for(let y=Math.floor(s.y0*2)/2;y<s.y1;y+=.5){
    if(!cellOn(h,s,x,y)||!freeOnHost(h,x,y,new Set())) continue;
    const d=addItem({key,gx:x,gy:y,on:h.uid}); place(d); anim(els.get(d.uid).el,'boing'); commit(); toast(name+'เสร็จแล้ว วางไว้บน'+DEFS[h.key][0],1800); return; }
  commit(); toast(name+'เสร็จแล้ว · ไม่มีที่วาง หยิบจากกล่องของหมวดครัวได้',2200); }
setInterval(()=>{ if(document.hidden) return; for(const it of items) if(it.cook) drawCook(it); },500);

/* ================= เซฟ / ย้อน ================= */
const KEYOF=()=>ROOMS[room].key;
function snapshot(){ return JSON.stringify({items:items.map(o=>({...o})), walls:state.walls, floor:state.floor, size:state.size, blocks:state.blocks||[]}); }
function restore(snap){ const s=JSON.parse(snap); clearItems(); state.walls=s.walls; state.floor=s.floor; state.blocks=s.blocks||[]; if(s.size) state.size=s.size; applySize(state.size.nx,state.size.ny); if(selBlock>state.blocks.length) selBlock=0;
  for(const o of s.items){ uidSeq=Math.max(uidSeq,o.uid+1); items.push(o); makeEl(o); }
  for(const it of items) place(it); drawScene(); sortAll(); }
function commit(){ state.items=items.map(o=>({...o})); save(); sortAll(); }
function save(){ try{ localStorage.setItem(KEYOF(), JSON.stringify(state)); }catch(e){} }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEYOF())||'null'); if(s&&s.items&&s.walls) return s; }catch(e){} return null; }
function pushUndo(snap){ undoStack.push(snap||snapshot()); if(undoStack.length>50) undoStack.shift(); $('#undoBtn').disabled=false; }
function undo(){ if(!undoStack.length) return; hideTools(); restore(undoStack.pop()); commit(); $('#undoBtn').disabled=!undoStack.length; toast('ย้อนกลับแล้ว',1000); if(curCat==='surface') renderStrip(); }

/* ================= กล้อง: เลื่อน + ซูม (ภาพเส้นเรียบ ซูมได้ต่อเนื่อง) ================= */
let cam={x:0,y:0}, S=1, K=1, Kfit=1;
// พื้นที่ที่ห้องใช้ได้: ตอนแต่ง เว้นด้านล่างให้กล่องของ และด้านบนให้แถบปุ่ม
function area(){ const top=editing?76:0, sh=$('#sheet'); const bot=editing&&!body.classList.contains('sheet-min')?sh.offsetHeight+16:(editing?60:0);
  document.documentElement.style.setProperty('--sheet-h',(editing?sh.offsetHeight:0)+'px');
  return {top, h:Math.max(200,window.innerHeight-top-bot)}; }
function fitLevels(){ const a=area(); Kfit=Math.min(window.innerWidth/(SW-20), a.h/(SH-20)); }
function setZoom(k,ax=window.innerWidth/2,ay=window.innerHeight/2){
  k=Math.max(Kfit,Math.min(Kfit*3.5,k)); if(Math.abs(k-S)<1e-4) return;
  const lx=(ax-cam.x)/S, ly=(ay-cam.y)/S; K=S=k; cam.x=ax-lx*S; cam.y=ay-ly*S; clampCam(); applyCam(); hideTools();
}
function clampCam(){
  const vw=window.innerWidth, vh=window.innerHeight, w=SW*S, h=SH*S;
  cam.x = w<=vw ? (vw-w)/2 : Math.min(0,Math.max(vw-w,cam.x));
  const A=area(); cam.y = h<=A.h ? A.top+(A.h-h)/2 : Math.min(A.top,Math.max(A.top+A.h-h,cam.y));
}
function applyCam(){ stage.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${S})`; }
function fit(){ fitLevels(); K=S=Kfit; const A=area(); cam.x=(window.innerWidth-SW*S)/2; cam.y=A.top+(A.h-SH*S)/2; clampCam(); applyCam(); hideTools(); }
// นิ้ว: ลากพื้นหลัง = เลื่อน · สองนิ้ว = ซูม
function hitTest(lx,ly){
  const list=items.map(it=>({it,z:+(els.get(it.uid)?.el.style.zIndex||0)})).sort((a,b)=>b.z-a.z);
  for(const {it} of list){ const d=DEFS[it.key], m=d.mask, g=geomOf(it); if(!m) continue;
    if(lx<g.left||ly<g.top||lx>g.left+g.w||ly>g.top+g.h) continue;
    const flip=els.get(it.uid)?.el.classList.contains('flip');
    let u=(lx-g.left)/g.w; if(flip) u=1-u; const v=(ly-g.top)/g.h;
    const x=Math.floor(u*m.w), y=Math.floor(v*m.h);
    // ยอมเผื่อรอบจุดเล็กน้อย (นิ้วไม่แม่น) แต่ต้องโดนเนื้อจริง
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ const xx=x+dx, yy=y+dy; if(xx>=0&&yy>=0&&xx<m.w&&yy<m.h&&m.a[yy*m.w+xx]>60) return it; }
  }
  return null;
}
holder.addEventListener('pointermove',e=>{ if(e.buttons) return; const [lx,ly]=toLogical(e); holder.classList.toggle('overitem',!!hitTest(lx,ly)); });
const ptrs=new Map(); let pinch=null;
holder.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:K}; cancelDrag(); return; }
  if(e.target!==holder && !e.target.closest('#stage')) return;
  const [lx,ly]=toLogical(e), hit=hitTest(lx,ly);
  if(hit){ onItemDown(e,hit); return; }
  hideTools();
  // โหมดแต่ง: แตะพื้น/ผนัง = เลือกส่วนนั้นไปเปลี่ยนสีเลย · โหมดห้อง·บล็อก ลากพื้นบล็อก = ย้าย
  if(editing){ const c=cellAt(lx,ly), bi=floorAt(c.gx,c.gy);
    if(bi!=null){ if(curCat==='surface'&&selSurf==='S'){ blockDown(e,bi); return; } tapPick(e,'F',bi); return; }
    const w=wallAt(lx,ly); if(w){ tapPick(e,w.side,w.bi); return; } }
  startPan(e);
});
// แถบผนัง·พื้น: แตะพื้น = เลือกบล็อกที่จะแต่ง · โหมดห้อง·บล็อก ลากพื้นบล็อกที่ต่อเพิ่ม = ย้ายบล็อก (ของบนบล็อกย้ายตาม)
// จุดบนจอ → ช่องพื้น (พื้นยก: ลองจากระดับสูงสุดลงมา)
function cellAt(lx,ly){ for(const z of GEO.levels){ const c=toCell(lx,ly+z), bi=floorAt(c.gx,c.gy); if(bi!=null&&blockLift(bi)===z) return c; } return toCell(lx,ly); }
function pickBlock(bi){ if(bi===selBlock) return; selBlock=bi; drawScene(); renderStrip(); toast(bi?'เลือกบล็อก '+bi+' แล้ว':'เลือกห้องหลักแล้ว',1200); }
// หน้าผนังที่จุดนี้ (หน้าสุดก่อน)
function wallAt(lx,ly){ const P=GEO.polys; if(!P) return null; const inside=(pts)=>{ let c=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[i], b=pts[j];
    if((a.y>ly)!==(b.y>ly) && lx<(b.x-a.x)*(ly-a.y)/(b.y-a.y)+a.x) c=!c; } return c; };
  const hit=P.face.filter(F=>inside(F.pts)).sort((a,b)=>(b.r.c*2+b.r.a0+b.r.a1)-(a.r.c*2+a.r.a0+a.r.a1))[0]; return hit?{side:hit.r.side,bi:hit.r.bi}:null; }
// แตะ (ไม่ลาก) พื้น/ผนัง → เปิดแท็บผนัง·พื้น เลือกส่วนนั้น · ลาก = เลื่อนห้องตามปกติ
function tapPick(e,surf,bi){ const sx=e.clientX, sy=e.clientY; startPan(e);
  const up=ev=>{ window.removeEventListener('pointerup',up); if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>=8) return;
    const same=curCat==='surface'&&selSurf===surf&&selBlock===bi; curCat='surface'; selSurf=surf; selBlock=bi; setSheetMin(false); buildTabs(); renderStrip(); drawScene();
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('#strip .swatch[aria-pressed="true"]')?.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})));   // เลื่อนให้เห็นสีที่ใช้อยู่
    if(!same) toast(({L:'ผนังซ้าย',R:'ผนังขวา',F:'พื้น'})[surf]+' · '+(bi?'บล็อก '+bi:'ห้องหลัก')+' — แตะสีด้านล่างได้เลย',1600); };
  window.addEventListener('pointerup',up); }
function blockDown(e,bi){ const sx=e.clientX, sy=e.clientY, [lx0,ly0]=toLogical(e), c0=toCell(lx0,ly0+blockLift(bi));
  if(!(bi>0&&selSurf==='S')){ startPan(e); const up=ev=>{ window.removeEventListener('pointerup',up); if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8) pickBlock(bi); }; window.addEventListener('pointerup',up); return; }
  e.preventDefault(); const b=state.blocks[bi-1], pv=blockPreview(), z=blockLift(bi); let dx=0, dy=0, moved=false;
  const mv=ev=>{ if(pinch){ end(); return; } if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return; moved=true;
    const [lx,ly]=toLogical(ev), c=toCell(lx,ly+z); dx=Math.round(c.gx-c0.gx); dy=Math.round(c.gy-c0.gy);
    const ext=state.blocks.map((o,k)=>k===bi-1?{...o,x:o.x+dx,y:o.y+dy}:o); pv.show({...b,x:b.x+dx,y:b.y+dy},blocksOK([{x:0,y:0,w:NX,h:NY},...ext])); };
  const end=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',end); pv.hide(); };
  const up=()=>{ end(); if(!moved){ pickBlock(bi); return; } moveBlock(bi,dx,dy); };
  window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',end); }
function blockPreview(){ let svg=$('#blkPrev');
  if(!svg){ svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.id='blkPrev'; svg.innerHTML='<polygon/>'; stage.appendChild(svg); }
  const pg=svg.firstChild;
  return {show(b,ok){ const P=[scr(b.x,b.y),scr(b.x+b.w,b.y),scr(b.x+b.w,b.y+b.h),scr(b.x,b.y+b.h)].map(p=>up(p,(b.lift||0)*STEP)); pg.setAttribute('points',P.map(p=>p.x+','+p.y).join(' ')); pg.setAttribute('class',ok?'ok':'no'); svg.style.display='block'; },
    hide(){ svg.style.display='none'; }}; }
window.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch && ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); setZoom(pinch.k*d/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); } });
const endPtr=e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; };
window.addEventListener('pointerup',endPtr); window.addEventListener('pointercancel',endPtr);
let panStop=null;
function startPan(e){
  const sx=e.clientX, sy=e.clientY, cx=cam.x, cy=cam.y; holder.classList.add('panning');
  const mv=ev=>{ if(pinch){ up(); return; } if(ev.buttons===0 && ev.pointerType==='mouse'){ up(); return; }
    cam.x=cx+ev.clientX-sx; cam.y=cy+ev.clientY-sy; clampCam(); applyCam(); };
  const up=()=>{ holder.classList.remove('panning'); window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); window.removeEventListener('pointercancel',up); panStop=null; };
  panStop=up; window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
}
let wheelAcc=0;
holder.addEventListener('wheel',e=>{ e.preventDefault();
  if(e.ctrlKey){ wheelAcc-=e.deltaY; setZoom(S*Math.exp(-e.deltaY*0.01),e.clientX,e.clientY); return; }
  cam.x-=e.deltaX; cam.y-=e.deltaY; clampCam(); applyCam(); },{passive:false});
$('#zoomIn').addEventListener('click',()=>setZoom(S*1.3));
$('#zoomOut').addEventListener('click',()=>setZoom(S/1.3));

/* ================= ท่าขยับ / อนุภาค ================= */
function particle(cls,x,y,dx){
  const p=document.createElement('div'); p.className='pt '+cls; const z=(cls==='heart'||cls==='spark')?5:1;
  p.style.left=(x/z)+'px'; p.style.top=(y/z)+'px'; if(dx!=null) p.style.setProperty('--dx',(dx/z)+'px');
  stage.appendChild(p); p.addEventListener('animationend',()=>p.remove()); setTimeout(()=>p.remove(),2500);
}
function anim(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function burst(it,cls,n,top=.1,spread=.6,gap=120){ const g=geomOf(it);
  for(let i=0;i<n;i++) setTimeout(()=>particle(cls,g.left+g.w*(0.5-spread/2+Math.random()*spread),g.top+g.h*top,(Math.random()-.5)*8),i*gap); }
function dust(it){ const g=geomOf(it); for(let i=0;i<5;i++) particle('dust', g.left+g.w*(i/4), g.top+g.h-2, (i<2?-1:1)*(2+i)); }
function interact(it){
  const r=els.get(it.uid), mode=DEFS[it.key][5];
  const toggle=()=>{ it.lit=!it.lit; place(it); commit(); };
  switch(mode){
    case 'bed': anim(r.el,'boing'); burst(it,'heart',3,.3,.5,130); break;
    case 'chair': anim(r.el,'boing'); burst(it,'heart',2,.2,.4,150); break;
    case 'vanity': anim(r.el,'boing'); burst(it,'spark',5,.15,.6,110); break;
    case 'wardrobe': case 'wobble': anim(r.el,'wobble'); break;
    case 'plant': anim(r.el,'sway'); break;
    case 'rug': anim(r.el,'flutter'); break;
    case 'lamp': toggle(); anim(r.el,'boing'); break;
    case 'door': if(editing){ anim(r.el,'wobble'); break; } goRoom(doorTo(it)); return;
    case 'vinyl': toggle(); anim(r.el,'boing'); toast(it.lit?'เปิดแผ่นแล้ว':'หยุดเพลงแล้ว',900); break;
    case 'tv': toggle(); if(it.lit) burst(it,'note',3,.1,.5,200); break;
    case 'lights': toggle(); if(it.lit) burst(it,'spark',4,.3,.9,90); break;
    case 'candle': toggle(); break;
    case 'fridge': anim(r.el,'wobble'); burst(it,'spark',3,.2,.6,120); break;
    case 'stove': anim(r.el,'boing'); burst(it,'steam',5,.05,.4,140); break;
    case 'steam': anim(r.el,'boing'); burst(it,'steam',3,0,.4,160); break;
    case 'sink': { const fx=FX[it.key]&&FX[it.key].tap; if(!fx||r.stream){ anim(r.el,'boing'); break; } const g=geomOf(it), fl=r.el.classList.contains('flip');
      const e=document.createElement('div'); e.className='stream'; Object.assign(e.style,{left:(fx.x*g.w-1.3)+'px',top:(fx.y*g.h)+'px',height:((fx.y2-fx.y)*g.h)+'px'});
      r.spr.appendChild(e); r.stream=e; e.addEventListener('animationend',()=>{ e.remove(); r.stream=null; }); toast('เปิดก๊อกน้ำ',900); } break;
    case 'farm': farmTap(it); break;
    case 'cook': cookTap(it); break;
    case 'washer': toggle(); toast(it.lit?'เริ่มซักผ้าแล้ว':'หยุดซักแล้ว',900); break;
    case 'purifier': toggle(); toast(it.lit?'เปิดเครื่องฟอกอากาศ':'ปิดเครื่องฟอกอากาศ',900); break;
    case 'vacuum': anim(r.el,'wobble'); { const g=geomOf(it), fl=r.el.classList.contains('flip'); for(let i=0;i<6;i++) setTimeout(()=>{ const e=document.createElement('div'); e.className='puff';
      Object.assign(e.style,{left:(g.left+g.w*(fl?.8:.2)+(Math.random()-.5)*8)+'px',top:(g.top+g.h*.9)+'px'}); e.style.setProperty('--dx',((Math.random()-.5)*16)+'px'); stage.appendChild(e); e.addEventListener('animationend',()=>e.remove()); },i*70); } break;
    case 'water': anim(r.el,'wobble'); { const g=geomOf(it); for(let i=0;i<10;i++) setTimeout(()=>{ const d=document.createElement('div'); d.className='drop'; Object.assign(d.style,{left:(g.left+g.w*(.05+Math.random()*.25))+'px',top:(g.top+g.h*.45)+'px'}); stage.appendChild(d); d.addEventListener('animationend',()=>d.remove()); },i*60); } break;
    case 'tub': anim(r.el,'boing'); burst(it,'bubble',8,.2,.8,100); break;
    case 'clock': anim(r.el,'wobble'); burst(it,'note',2,0,.4,200); break;
    case 'window': burst(it,'spark',4,.2,.7,120); break;
    case 'cake': anim(r.el,'boing'); burst(it,'heart',2,0,.5,150); break;
    default: anim(r.el,'boing');
  }
}
// ชีวิตเล็ก ๆ ในบ้าน: ไอน้ำจากกาน้ำชา · ประกายที่กระจก

  const pots=items.filter(o=>o.key==='t-teapot'||o.key==='t-mug'); if(pots.length && Math.random()<.6) burst(pots[(Math.random()*pots.length)|0],'steam',1,0,.3);
  const mir=items.filter(o=>o.key==='vanity'||o.key==='w-mirror'); if(mir.length && Math.random()<.4) burst(mir[(Math.random()*mir.length)|0],'spark',1,.1,.5); },1800);

/* ================= แถบเครื่องมือบนของ ================= */
let selected=null, toolsT;
