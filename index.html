      const [mi,pl]=card.querySelectorAll('button'); mi.disabled=!mi0; pl.disabled=!pl0; mi.addEventListener('click',minus); pl.addEventListener('click',plus); strip.appendChild(card); };
    const ext=state.blocks||[], bname=i=>i?'บล็อก '+i:'ห้องหลัก';
    if(selSurf==='S'){ // ขนาดห้อง (ยาวตามผนังซ้าย/ขวา ทีละ 50 ซม.) · บล็อกที่ต่อเพิ่ม · ปุ่มต่อบล็อก
      const pre=ext.length?'ห้องหลัก · ':'';
      sizer(pre+'ผนังซ้าย',NY,()=>setRoomSize(NX,NY-2),()=>setRoomSize(NX,NY+2),NY>ROOM_MIN,NY<ROOM_MAX);
      sizer(pre+'ผนังขวา',NX,()=>setRoomSize(NX-2,NY),()=>setRoomSize(NX+2,NY),NX>ROOM_MIN,NX<ROOM_MAX);
      ext.forEach((b,k)=>{ const i=k+1;
        sizer(bname(i)+' · ผนังซ้าย',b.h,()=>resizeBlock(i,0,-2),()=>resizeBlock(i,0,2),b.h>BLOCK_MIN,b.h<ROOM_MAX);
        sizer(bname(i)+' · ผนังขวา',b.w,()=>resizeBlock(i,-2,0),()=>resizeBlock(i,2,0),b.w>BLOCK_MIN,b.w<ROOM_MAX);
        sizer(bname(i)+' · ยกพื้น',b.lift||0,()=>liftBlock(i,-1),()=>liftBlock(i,1),(b.lift||0)>0,(b.lift||0)<LIFT_MAX,v=>v?v+' ขั้น':'ไม่ยก');
        const del=document.createElement('button'); del.className='slot'; del.setAttribute('aria-label','ลบ'+bname(i));
        del.innerHTML=`<div class="pic"><span class="ic">${svgIcon('x')}</span></div><span>ลบ${bname(i)}</span>`; del.addEventListener('click',()=>delBlock(i)); strip.appendChild(del); });
      const add=document.createElement('button'); add.className='slot'; add.setAttribute('aria-label','ต่อบล็อกเพิ่ม');
      add.innerHTML=`<div class="pic"><span class="ic">${svgIcon('plus')}</span></div><span>ต่อบล็อก</span>`; add.addEventListener('click',addBlock); strip.appendChild(add);
      return; }
    // แต่งส่วนไหน (มีบล็อกต่อเพิ่ม): แตะเลือก หรือแตะพื้นบล็อกในห้อง
    if(ext.length){ const card=document.createElement('div'); card.className='slot sizer pickb';
      card.innerHTML='<span class="lab">แต่งส่วนไหน</span><div class="row"></div>'; const row=card.lastChild;
      for(let i=0;i<=ext.length;i++){ const c=document.createElement('button'); c.className='zchip'; c.textContent=bname(i); c.setAttribute('aria-pressed',i===selBlock?'true':'false');
        c.addEventListener('click',()=>{ selBlock=i; drawScene(); renderStrip(); }); row.appendChild(c); }
      strip.appendChild(card); }
    if(selBlock>ext.length) selBlock=0;
    const st=blockStyle(selBlock), list = selSurf==='F' ? FLOORS : WALLS, cur = selSurf==='F' ? st.floor : st.walls[selSurf];
    const setSurf=id=>{ const b=selBlock?ext[selBlock-1]:null;
      if(selSurf==='F'){ if(b) b.floor=id; else state.floor=id; } else if(b) b.walls={...(b.walls||{}),[selSurf]:id}; else state.walls[selSurf]=id; };
    for(const [id,o] of Object.entries(list)){
      const b=document.createElement('button'); b.className='slot swatch'; b.setAttribute('aria-pressed', cur===id?'true':'false');
      b.setAttribute('aria-label',(selSurf==='F'?'พื้น ':'ผนัง ')+o.name);
      const pic=document.createElement('div'); pic.className='pic'; pic.appendChild(swatchCanvas(selSurf==='F'?'floor':'wall',id));
      const sp=document.createElement('span'); sp.textContent=o.name; b.append(pic,sp);
      b.addEventListener('click',()=>{ if(cur===id) return; pushUndo(); setSurf(id); drawScene(); for(const o of items) if((DEFS[o.key][6]||{}).gen) place(o); commit(); renderStrip(); });
      strip.appendChild(b);
    }
    return;
  }
  const box = window.innerHeight<=500 ? 44 : 60;
  for(const [key,d] of Object.entries(DEFS)){
    if(d[1]!==curCat) continue;
    const b=document.createElement('button'); b.className='slot'; b.setAttribute('aria-label','ลาก'+d[0]+'ไปวางในห้อง');
    const k=box/Math.max(d[3],d[4]);
    const pic=document.createElement('div'); pic.className='pic';
    const im=document.createElement('div'); im.style.width=Math.round(d[3]*k)+'px'; im.style.height=Math.round(d[4]*k)+'px'; im.style.backgroundImage=`url(${srcOf(key)})`;
    pic.appendChild(im);
    const lab=document.createElement('span'); lab.textContent=d[0]; b.append(pic,lab);
    b.addEventListener('pointerdown',e=>startCatalogDrag(e,key));
    strip.appendChild(b);
  }
}
// ลูกกลิ้งเมาส์ (หมุนแนวตั้ง) = เลื่อนแถบแนวนอน · ทัชแพดที่ปัดแนวนอนอยู่แล้วปล่อยให้เลื่อนเอง
for(const sel of ['#strip','.tabs']) document.querySelectorAll(sel).forEach(el=>el.addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)<=Math.abs(e.deltaX) || el.scrollWidth<=el.clientWidth) return;
  e.preventDefault(); el.scrollLeft+=e.deltaY; },{passive:false}));
function startCatalogDrag(e,key){
  // ลากซ้ายขวา = เลื่อนกล่อง (นิ้ว: เบราว์เซอร์เลื่อนเอง · เมาส์: เลื่อนด้วยโค้ด) · ลากขึ้น = หยิบของ
  const x0=e.clientX,y0=e.clientY, strip=$('#strip'), s0=strip.scrollLeft;
  if(e.pointerType==='mouse'){ e.preventDefault(); }
  const wait=ev=>{ const dx=ev.clientX-x0, dy=ev.clientY-y0; if(Math.hypot(dx,dy)<6) return; done();
    if(Math.abs(dy)>Math.abs(dx)){ beginDrag({key},e,ev); return; }
    if(e.pointerType!=='mouse') return;
    const mv=m=>{ strip.scrollLeft=s0-(m.clientX-x0); }, up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); };
  const done=()=>{ window.removeEventListener('pointermove',wait); window.removeEventListener('pointerup',done); window.removeEventListener('pointercancel',done); };
  window.addEventListener('pointermove',wait); window.addEventListener('pointerup',done); window.addEventListener('pointercancel',done);
}
function setSheetMin(m){ body.classList.toggle('sheet-min',m); $('#minBtn .mlab').textContent=m?'เปิดกล่องของ':'ย่อ'; $('#minBtn').setAttribute('aria-expanded',m?'false':'true'); $('#minBtn').setAttribute('aria-label',m?'เปิดกล่องของ':'ย่อกล่องของ'); }
$('#minBtn').addEventListener('click',e=>{ if(e.detail) e.currentTarget.blur();   // กดด้วยเมาส์/นิ้ว ไม่ต้องค้างกรอบโฟกัส (คีย์บอร์ดยังเห็นกรอบ)
  setSheetMin(!body.classList.contains('sheet-min')); setTimeout(fit,30); });

/* ================= สลับโหมด ================= */
function setEditing(on){
  editing=on; body.classList.toggle('editing',on); hideTools();
  if(on){ editStart=snapshot(); undoStack.length=0; $('#undoBtn').disabled=true; setSheetMin(false); renderStrip(); toast('ลากของขึ้นไปวาง · แตะของในห้องเพื่อหมุนหรือเก็บ',2600); }
  drawScene(); setTimeout(fit,30);
}
$('#fab').addEventListener('click',()=>setEditing(true));
$('#doneBtn').addEventListener('click',()=>{ setEditing(false); commit(); toast('บันทึกห้องแล้ว',1400); });
$('#cancelBtn').addEventListener('click',()=>{ if(editStart) restore(editStart); setEditing(false); commit(); toast('ยกเลิกที่แต่งรอบนี้แล้ว',1600); });
$('#undoBtn').addEventListener('click',undo);
document.addEventListener('keydown',e=>{
  if(editing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(e.key==='Escape'){ if($('#house').classList.contains('show')) closeHouse(); else if(selected) hideTools(); }
  if(e.key==='+'||e.key==='=') setZoom(S*1.3); if(e.key==='-') setZoom(S/1.3);
});

/* ================= ปุ่มโหมดดู ================= */
function setNight(on){
  body.classList.toggle('isnight',on); state.night=on; drawScene(); requestLights();
  const b=$('#nightBtn'); b.innerHTML=`<span class="ic">${svgIcon(on?'sun':'moon')}</span>`; const lab = on ? 'เปิดไฟ' : 'ปิดไฟ';
  b.setAttribute('aria-label',lab); b.title=lab; b.setAttribute('aria-pressed', on?'true':'false');
}
$('#nightBtn').addEventListener('click',()=>{ const on=!body.classList.contains('isnight'); setNight(on); save(); toast(on?'ราตรีสวัสดิ์ · แตะโคมไฟเพื่อเปิดปิด':'อรุณสวัสดิ์!',1800); });
$('#fullBtn').addEventListener('click',()=>{ const no=()=>toast('เบราว์เซอร์นี้ไม่ให้เปิดเต็มจอ ลองกด F11 แทนนะ');
  try{ if(document.fullscreenElement) document.exitFullscreen(); else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(no); else no(); }catch(e){ no(); } });

/* ================= เริ่ม ================= */
(async()=>{
// ขนาดภาพอ่านจากไฟล์จริง (ตัดใหม่เมื่อไหร่ก็ไม่ต้องแก้ตัวเลข)
// ขนาดบนจอ: ของตั้งพื้นกว้างเท่าฐาน (fw+fd)·CW · ของติดผนัง/ชิ้นเล็กกว้าง w ช่อง · สูงตามสัดส่วนภาพ
let META={}; try{ META=await (await fetch(IMG+'meta.json',{cache:'no-store'})).json(); }catch(e){}
// ผิววางของ/จุดวางที่เจ้าของตีเส้นเองใน surf-edit.html (ทับค่าใน DEFS)
try{ const SF=await (await fetch('surfs.json',{cache:'no-store'})).json(); for(const [k,v] of Object.entries(SF)){ if(!DEFS[k]) continue; const o=DEFS[k][6]=DEFS[k][6]||{};
  if(v.surf) o.surf=v.surf; if(v.spots) DEFS[k].spots=v.spots; } }catch(e){}
await Promise.all(Object.keys(DEFS).map(k=>new Promise(res=>{ const im=new Image(); im.onload=()=>{ const d=DEFS[k], o=d[6]=d[6]||{}, m=META[k];
  if(m && d[2]!=='wall'){
    // ภาพที่ดัดเข้ามุมเกมแล้ว (tools/modern-warp.py): ฐาน fw·fd และตำแหน่งมุมฐานในภาพ (ความละเอียด res เท่า)
    o.fw=m.fw; o.fd=m.fd; d.round=!!m.round; const s=1/m.res; d[3]=m.w*s; d[4]=m.h*s; d.base={xl:m.xl*s, xr:m.xr*s, yb:m.yb*s}; d.src=IMG+'fit/'+k+'.png';
  } else { const w=(d[2]==='floor'||d[2]==='rug') ? ((o.fw||1)+(o.fd||1))*CW : (o.w||1)*CW; d[3]=w; d[4]=w*im.naturalHeight/im.naturalWidth; }
  res(); }; im.onerror=()=>{ delete DEFS[k]; res(); }; im.src=(DEFS[k][6]||{}).gen?(DEFS[k].src=doorSeamURL('#efebe5')):IMG+k+'.png'; })));
// หน้ากากความทึบของแต่ละภาพ (ย่อ ≤160 จุด) ไว้ตัดสินว่าคลิกโดนเนื้อของจริงไหม
await Promise.all(Object.keys(DEFS).map(k=>new Promise(res=>{ const im=new Image(); im.onload=()=>{
  const sc=Math.min(1,160/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.max(1,Math.round(im.naturalWidth*sc)), h=Math.max(1,Math.round(im.naturalHeight*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); g.drawImage(im,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data, a=new Uint8Array(w*h); for(let i=0;i<w*h;i++) a[i]=d[i*4+3];
  DEFS[k].mask={w,h,a}; res(); }; im.onerror=res; im.src=srcOf(k); })));
stage.style.width=SW+'px'; stage.style.height=SH+'px';
state = load();
if(!state){ const R=ROOMS[room]; state={v:1,night:false,walls:{...R.walls},floor:R.floor,size:{...R.size},blocks:[],items:[]}; }
if(!state.size) state.size={...ROOMS[room].size}; if(!state.blocks) state.blocks=[]; NX=state.size.nx; NY=state.size.ny; normalizeBlocks(); applySize(state.size.nx,state.size.ny);
buildWalls(); buildTabs();
if(state.items.length){ for(const o of state.items.filter(o=>DEFS[o.key])){ uidSeq=Math.max(uidSeq,o.uid+1); const it={...o};
    if(DEFS[it.key][2]!=='wall' && it.on==null && !onFloor(it.key,it.gx,it.gy,it.flip)){ const {fw,fd}=fp(it.key,it.flip); it.gx=Math.max(0,Math.min(NX-fw,it.gx)); it.gy=Math.max(0,Math.min(NY-fd,it.gy)); }   // ฐานเปลี่ยนขนาด → ดันกลับเข้าห้อง
    items.push(it); makeEl(it); } for(const it of items) place(it); }
else { ROOMS[room].starter(); items=items.filter(it=>DEFS[it.key]); for(const it of items) place(it); }
fixItems(); ensureDoor(); for(const it of items) place(it);   // fixItems: เซฟเก่าที่บล็อกถูกซ่อม ของที่ไม่มีพื้นแล้วเก็บเข้ากล่อง
if(!ROOMS[room].cats.includes(curCat)){ curCat=ROOMS[room].cats[0]; buildTabs(); }
body.classList.toggle('isnight',!!state.night);
setNight(!!state.night); commit();
fit(); window.addEventListener('resize',fit);
if(location.hash==='#edit') setEditing(true);   // เปิดโหมดแต่งตรง ๆ (ไว้ทดสอบ)
})();
setTimeout(()=>toast('ลากเพื่อเลื่อน · สองนิ้วเพื่อซูม · แตะของเพื่อเล่น',3600),500);
</script>
